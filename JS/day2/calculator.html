<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콘솔창 계산기(사칙연산만 가능)</title>
    <style>
        .bold {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>콘솔창 계산기(사칙연산만 가능)</h1>

    <div id="div1">
        <h2>Windows OS</h2>
        <hr>
        <ol>
            <li class="bold">F12 키를 눌러 콘솔 창 열기</li>
            <li>콘솔창에 "start()" 를 입력하여 계산기 실행</li>
        </ol>
    </div>

    <div id="div2">
        <h2>Mac OS</h2>
        <hr>
        <ol>
            <li class="bold">Option + Command + i 키를 눌러 콘솔 창 열기</li>
            <li>콘솔창에 "start()" 를 입력하여 계산기 실행</li>
        </ol>
    </div>

    <script>
        function calculate(expression) {
            const tokens = String(expression ?? '').match(/(\d+(\.\d+)?|[+\-*/])/g);

            // 1차 계산: 곱셈(*), 나눗셈(/) 우선 처리
            const stack = [];

            for (let i = 0; i < tokens.length; i++) {
                const token = tokens[i];

                if (token === '*' || token === '/') {
                    const prev = Number(stack.pop());
                    const next = Number(tokens[++i]);

                    stack.push(token === '*' ? prev * next : prev / next);
                }
                else {
                    stack.push(token);
                }
            }

            // 2차 계산: 덧셈(+), 뺄셈(-) 순서대로 처리
            let result = Number(stack[0]);

            for (let i = 1; i < stack.length; i += 2) {
                const operator = stack[i];
                const next = Number(stack[i + 1]);

                if (operator === '+')
                    result += next;
                else if (operator === '-')
                    result -= next;
            }

            return result;
        }

        function start() {
            const input = prompt('계산식을 입력하세요.(예: 1 + 1 * 4)');
            const result = calculate(input);

            console.log(`결과: ${result}`);
        }

        // start();
    </script>
</body>

</html>
